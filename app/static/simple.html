<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a1912">
    <title>تشخيص أمراض النبات - Smart Agriculture Vision</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --primary-green: #10b981;
            --primary-dark: #059669;
            --accent-green: #0a4a2e;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --radius-card: 16px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-light);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
            overflow-x: hidden;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: var(--glass-border);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow);
        }

        header {
            width: 100%;
            max-width: 800px;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-green);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-links {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .nav-link {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 0.4rem 0.95rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: var(--transition);
        }

        .nav-link:hover {
            background: var(--primary-green);
            color: #fff;
        }

        .model-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #10b981;
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
        }

        .main-card {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .model-selector-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            padding: 0.7rem 1rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            flex-wrap: wrap;
        }

        .model-selector-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .model-selector-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .model-opt-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-muted);
            padding: 0.42rem 0.95rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .model-opt-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-light);
        }

        .model-opt-btn.active {
            background: linear-gradient(135deg, var(--primary-green), var(--primary-dark));
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 3px 12px rgba(16, 185, 129, 0.35);
        }

        .upload-zone {
            border: 2px dashed rgba(16, 185, 129, 0.5);
            border-radius: var(--radius-card);
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
            min-height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .upload-zone:hover {
            border-color: var(--primary-green);
            background: rgba(16, 185, 129, 0.05);
        }

        .upload-zone input {
            display: none;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .upload-text {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        #image-preview {
            max-width: 100%;
            max-height: 320px;
            border-radius: 12px;
            display: none;
            object-fit: contain;
        }

        .action-buttons {
            display: flex;
            gap: 1.2rem;
        }

        .btn-action {
            flex: 1;
            padding: 1.1rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 14px;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: var(--transition);
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .results-section {
            display: none;
            padding: 1.5rem;
            margin-top: 0.5rem;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .disease-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ef4444;
        }

        .disease-name.healthy {
            color: var(--primary-green);
        }

        .crop-type {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        .prediction-item {
            margin-bottom: 1rem;
        }

        .prediction-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.3rem;
            font-size: 0.95rem;
        }

        .progress-bg {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            border-radius: 4px;
            transition: width 1s ease;
        }

        .advice-box {
            background: rgba(255, 255, 255, 0.04);
            border-right: 3px solid var(--primary-green);
            padding: 1rem 1.2rem;
            border-radius: 8px;
            margin-top: 1.2rem;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            header {
                padding: 0.85rem 1rem;
                margin-bottom: 1rem;
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .logo {
                justify-content: center;
                font-size: 1.2rem;
            }
            .header-links {
                justify-content: center;
                flex-wrap: wrap;
                gap: 0.45rem;
            }
            .nav-link, .model-badge {
                font-size: 0.8rem;
                padding: 0.38rem 0.75rem;
            }
            .main-card {
                padding: 1.2rem;
                gap: 1.1rem;
            }
            .card-title {
                font-size: 1.1rem;
                justify-content: center;
            }
            .model-selector-bar {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                padding: 0.65rem;
            }
            .model-selector-group {
                display: grid;
                grid-template-columns: 1fr;
                gap: 0.45rem;
            }
            .model-opt-btn {
                width: 100%;
                padding: 0.55rem;
                font-size: 0.83rem;
            }
            .upload-zone {
                padding: 1.5rem 1rem;
                min-height: 185px;
            }
            #image-preview {
                max-height: 240px;
            }
            .results-section {
                padding: 1rem;
            }
            .disease-name {
                font-size: 1.12rem;
            }
        }

        @media (max-width: 600px) {
            .action-buttons {
                flex-direction: column;
                gap: 0.75rem;
            }
            .btn-action {
                width: 100%;
                padding: 0.95rem;
                font-size: 1rem;
            }
            #btn-camera {
                flex: 1 !important;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 0.6rem;
            }
            .main-card {
                padding: 0.95rem;
            }
            .logo {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <header class="glass">
        <div class="logo" style="display:flex; align-items:center; gap:0.7rem;">
            <a href="/" style="display:flex; align-items:center; gap:0.65rem; text-decoration:none; color:inherit;">
                <img src="/logo.png" alt="Smart Agri AI" style="width:40px; height:40px; border-radius:11px; border:1.5px solid rgba(52,211,153,0.45); box-shadow:0 4px 12px rgba(16,185,129,0.3);">
                <span>تشخيص أمراض النبات بالصورة</span>
            </a>
        </div>
        <div class="header-links" style="flex-wrap:wrap;">
            <a class="nav-link" href="/" style="background:rgba(16,185,129,0.16); border-color:rgba(16,185,129,0.45); color:#34d399; font-weight:700;">➡️ رجوع للرئيسية</a>
            <a class="nav-link" href="/cv/docs" target="_blank" rel="noopener">🔬 توثيق API</a>
            <span id="simple-auth-box">
                <a class="nav-link" href="/login?next=/simple" style="border-color:rgba(16,185,129,0.5); color:#34d399; font-weight:700;">🔐 تسجيل الدخول</a>
            </span>
            <div class="model-badge" id="top-model-badge">
                ⚡ الموديل: EfficientNetV2B2_best
            </div>
        </div>
    </header>

    <div class="main-card glass">
        <div class="card-title">
            <span>📸 اختيار الصورة وإظهار النتيجة</span>
        </div>

        <!-- Optional Model Selector -->
        <div class="model-selector-bar">
            <span class="model-selector-label">🎛️ اختيار موديل التشخيص:</span>
            <div class="model-selector-group">
                <button type="button" class="model-opt-btn active" id="btn-model-effnet" onclick="selectVisionModel('EfficientNetV2B2')">
                    ⚡ EfficientNetV2B2 (الأساسي المثبت)
                </button>
                <button type="button" class="model-opt-btn" id="btn-model-resnet" onclick="selectVisionModel('ResNet18')">
                    🧪 ResNet18 (موديل إضافي اختياري)
                </button>
            </div>
        </div>

        <div class="upload-zone" id="upload-zone">
            <input type="file" id="file-input" accept="image/*">
            <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">
            <img id="image-preview" src="" alt="معاينة الصورة">
            <div id="upload-placeholder">
                <div class="upload-icon">📸</div>
                <div class="upload-text">اضغط هنا لاختيار صورة ورقة النبات أو اسحبها إلى هنا</div>
            </div>
        </div>

        <div class="action-buttons" style="flex-wrap:wrap;">
            <button class="btn-action btn-primary" id="btn-select">
                📸 1. ارفع صورة
            </button>
            <button class="btn-action" id="btn-camera" style="flex:0.6; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2);">
                📷 كاميرا
            </button>
            <button class="btn-action btn-secondary" id="btn-diagnose" disabled>
                🔍 2. إظهار النتيجة
            </button>
        </div>

        <div class="results-section glass" id="results-section">
            <div class="result-header">
                <div>
                    <div class="disease-name" id="disease-name">تشخيص النبات</div>
                    <div class="crop-type" id="crop-type">المحصول</div>
                </div>
                <div class="model-badge" id="res-model-badge">
                    🤖 EfficientNetV2B2_best
                </div>
            </div>

            <div id="predictions-container"></div>

            <div class="advice-box" id="advice-box" style="display: none;">
                <strong>💡 التوصية والعلاج المعتمد:</strong>
                <div id="advice-text" style="margin-top: 0.5rem;"></div>
                <div id="advice-actions" style="display:flex; gap:0.5rem; margin-top:0.8rem; flex-wrap:wrap;"></div>
            </div>
        </div>
    </div>

    <script>
        let selectedFile = null;
        let selectedVisionModel = 'EfficientNetV2B2';

        function selectVisionModel(modelKey) {
            selectedVisionModel = modelKey;
            const btnEff = document.getElementById('btn-model-effnet');
            const btnRes = document.getElementById('btn-model-resnet');
            const topBadge = document.getElementById('top-model-badge');

            if (modelKey === 'EfficientNetV2B2') {
                btnEff.classList.add('active');
                btnRes.classList.remove('active');
                if (topBadge) topBadge.innerText = '⚡ الموديل: EfficientNetV2B2_best';
            } else {
                btnEff.classList.remove('active');
                btnRes.classList.add('active');
                if (topBadge) topBadge.innerText = '🧪 الموديل: ResNet18';
            }
        }

        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const cameraInput = document.getElementById('camera-input');
        const imagePreview = document.getElementById('image-preview');
        const uploadPlaceholder = document.getElementById('upload-placeholder');
        const btnSelect = document.getElementById('btn-select');
        const btnCamera = document.getElementById('btn-camera');
        const btnDiagnose = document.getElementById('btn-diagnose');
        const resultsSection = document.getElementById('results-section');

        btnSelect.addEventListener('click', () => fileInput.click());
        if (btnCamera && cameraInput) {
            btnCamera.addEventListener('click', () => cameraInput.click());
            cameraInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) handleFile(e.target.files[0]);
            });
        }
        uploadZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.style.borderColor = '#10b981';
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.style.borderColor = 'rgba(16, 185, 129, 0.5)';
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.style.borderColor = 'rgba(16, 185, 129, 0.5)';
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('الرجاء اختيار ملف صورة صالح.');
                return;
            }

            selectedFile = file;

            const reader = new FileReader();
            reader.onload = (e) => {
                imagePreview.src = e.target.result;
                imagePreview.style.display = 'block';
                uploadPlaceholder.style.display = 'none';
            };
            reader.readAsDataURL(file);

            btnDiagnose.disabled = false;
        }

        btnDiagnose.addEventListener('click', async () => {
            if (!selectedFile) return;

            btnDiagnose.disabled = true;
            btnDiagnose.innerText = '⏳ جاري التشخيص...';

            try {
                const formData = new FormData();
                formData.append('image', selectedFile);
                formData.append('model_choice', selectedVisionModel);
                formData.append('query', 'ما هو التشخيص وما هو العلاج المناسب؟');

                const tok = localStorage.getItem('agri_auth_token') || '';
                const res = await fetch('/api/diagnose', {
                    method: 'POST',
                    headers: tok ? { 'Authorization': `Bearer ${tok}` } : {},
                    body: formData
                });

                if (res.ok) {
                    const data = await res.json();
                    renderResults(data);
                } else {
                    alert('حدث خطأ في الاتصال بالخادم.');
                }
            } catch (err) {
                console.error(err);
                alert('حدث خطأ في الاتصال.');
            } finally {
                btnDiagnose.disabled = false;
                btnDiagnose.innerText = '🔍 2. إظهار النتيجة';
            }
        });

        function renderResults(data) {
            const cvData = data.cv_result || {};
            const modelName = cvData.model_used || (selectedVisionModel === 'ResNet18' ? 'ResNet18' : 'EfficientNetV2B2_best.keras');

            document.getElementById('res-model-badge').innerText = `🤖 الموديل: ${modelName}`;

            const topClassRaw = cvData.predicted_class || (cvData.top_predictions && cvData.top_predictions[0] ? cvData.top_predictions[0].class : '');
            const topClassAr = cvData.predicted_class_ar || (cvData.predictions && cvData.predictions[0] ? cvData.predictions[0].label_ar : '');
            const diseaseText = topClassRaw
                ? (topClassAr && topClassAr !== topClassRaw ? `${topClassRaw} (${topClassAr})` : topClassRaw)
                : (cvData.disease_name || "تشخيص النبات");

            const diseaseEl = document.getElementById('disease-name');
            diseaseEl.innerText = diseaseText;
            if (diseaseText.includes('سليم') || diseaseText.toLowerCase().includes('healthy')) {
                diseaseEl.classList.add('healthy');
            } else {
                diseaseEl.classList.remove('healthy');
            }

            document.getElementById('crop-type').innerText = `المحصول: ${cvData.crop_type_ar || cvData.crop_type || 'عام'}`;

            const container = document.getElementById('predictions-container');
            container.innerHTML = '';

            const items = (cvData.predictions && cvData.predictions.length > 0)
                ? cvData.predictions
                : (cvData.top_predictions || []);

            items.slice(0, 3).forEach(pred => {
                let confPercent = 0;
                let confDisplay = '';
                if (pred.confidence_str) {
                    confDisplay = pred.confidence_str;
                    confPercent = parseFloat(pred.confidence_str.replace('%', ''));
                } else if (typeof pred.confidence === 'string' && pred.confidence.includes('%')) {
                    confDisplay = pred.confidence;
                    confPercent = parseFloat(pred.confidence.replace('%', ''));
                } else {
                    const rawConf = Number(pred.confidence || 0);
                    confPercent = rawConf <= 1 ? (rawConf * 100) : rawConf;
                    confDisplay = `${confPercent.toFixed(2)}%`;
                }

                const color = confPercent > 80 ? '#10b981' : (confPercent > 50 ? '#f59e0b' : '#ef4444');
                const rawName = pred.class || pred.label || pred.name || "فئة زراعية";
                const arName = pred.label_ar && pred.label_ar !== rawName ? ` — ${pred.label_ar}` : '';
                const predName = `${rawName}${arName}`;

                container.innerHTML += `
                    <div class="prediction-item">
                        <div class="prediction-label">
                            <span>${predName}</span>
                            <span style="color: ${color}; font-weight: 700;">${confDisplay}</span>
                        </div>
                        <div class="progress-bg">
                            <div class="progress-bar" style="width: ${Math.min(100, confPercent)}%; background: ${color}"></div>
                        </div>
                    </div>
                `;
            });

            if (data.advice) {
                const adviceText = data.advice.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                document.getElementById('advice-text').innerHTML = adviceText;
                const safeRaw = data.advice.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/\r/g, '');
                document.getElementById('advice-actions').innerHTML = `
                    <button type="button" onclick="speakEgyptianAdvice('${safeRaw}', this)" style="background:rgba(59,130,246,0.18); border:1px solid rgba(59,130,246,0.4); color:#60a5fa; border-radius:10px; padding:4px 12px; font-size:0.8rem; cursor:pointer;">🔊 استماع باللهجة المصرية</button>
                    <button type="button" onclick="navigator.clipboard.writeText('${safeRaw}'); this.innerText='✅ تم النسخ';" style="background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#e2e8f0; border-radius:10px; padding:4px 12px; font-size:0.8rem; cursor:pointer;">📋 نسخ التوصية</button>
                    <button type="button" onclick="window.open('https://wa.me/?text=' + encodeURIComponent('${safeRaw}'), '_blank')" style="background:rgba(16,185,129,0.18); border:1px solid rgba(16,185,129,0.4); color:#34d399; border-radius:10px; padding:4px 12px; font-size:0.8rem; cursor:pointer;">💬 مشاركة واتساب</button>
                `;
                document.getElementById('advice-box').style.display = 'block';
            }

            resultsSection.style.display = 'block';
        }

        let currentSimpleAudio = null;
        function speakEgyptianAdvice(text, btn) {
            if (currentSimpleAudio && !currentSimpleAudio.paused) {
                currentSimpleAudio.pause();
                currentSimpleAudio = null;
                if (btn) btn.innerText = '🔊 استماع باللهجة المصرية';
                return;
            }
            const cleanText = text.replace(/[#*`]/g, '');
            const url = `/api/tts?voice=ar-EG-ShakirNeural&text=${encodeURIComponent(cleanText.slice(0, 900))}`;
            if (btn) btn.innerText = '⏹️ إيقاف الصوت';
            currentSimpleAudio = new Audio(url);
            currentSimpleAudio.onended = () => { if (btn) btn.innerText = '🔊 استماع باللهجة المصرية'; };
            currentSimpleAudio.play().catch(() => { if (btn) btn.innerText = '🔊 استماع باللهجة المصرية'; });
        }

        (async function checkSimpleAuth() {
            const box = document.getElementById('simple-auth-box');
            if (!box) return;
            try {
                const rawU = localStorage.getItem('agri_user');
                if (rawU) {
                    const u = JSON.parse(rawU);
                    if (u && u.full_name) {
                        box.innerHTML = `<span class="nav-link" style="border-color:rgba(16,185,129,0.4); color:#34d399;">👤 ${u.full_name}</span>`;
                    }
                }
            } catch (e) {}
            try {
                const tok = localStorage.getItem('agri_auth_token') || '';
                const res = await fetch('/api/auth/me', {
                    credentials: 'same-origin',
                    headers: tok ? { 'Authorization': `Bearer ${tok}` } : {}
                });
                if (res.status === 401) {
                    localStorage.removeItem('agri_auth_token');
                    localStorage.removeItem('agri_user');
                    box.innerHTML = `<a class="nav-link" href="/login?next=/simple" style="border-color:rgba(16,185,129,0.5); color:#34d399; font-weight:700;">🔐 تسجيل الدخول</a>`;
                    return;
                }
                if (!res.ok) return;
                const d = await res.json();
                if (d.authenticated && d.user) {
                    localStorage.setItem('agri_user', JSON.stringify(d.user));
                    if (d.token) localStorage.setItem('agri_auth_token', d.token);
                    box.innerHTML = `<span class="nav-link" style="border-color:rgba(16,185,129,0.4); color:#34d399;">👤 ${d.user.full_name}</span>`;
                }
            } catch (e) {}
        })();
    </script>
</body>
