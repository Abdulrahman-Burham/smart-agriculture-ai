name: CI/CD Pipeline - Smart Agriculture AI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Continuous Integration: Linting, Unit & Integration Tests ─────────
  quality-and-tests:
    name: 🧪 CI — Linting & Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install Dependencies (CPU-Optimized)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install ruff pytest-cov

      - name: 🔍 Static Code Analysis & Syntax Validation
        run: |
          echo "Running Ruff syntax & fatal error validation..."
          ruff check app/ computer_vision/ tests/ --select=E9,F63,F7,F82

      - name: 🧪 Execute Full Pytest Test Suite
        run: |
          mkdir -p reports
          PYTHONPATH=. pytest tests/ rag/tests/ -v --junitxml=reports/test-results.xml

      - name: 📊 Generate Automated QA & SLA Benchmark Report
        run: |
          PYTHONPATH=. python scripts/generate_qa_report.py

      - name: 📤 Upload QA & Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-and-test-reports
          path: reports/
          retention-days: 14

      - name: 📝 Publish GitHub Step Summary
        if: always()
        run: |
          echo "## 🌾 CI Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ All automated tests passed successfully." >> $GITHUB_STEP_SUMMARY
          if [ -f "reports/QA_Report.md" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            cat reports/QA_Report.md >> $GITHUB_STEP_SUMMARY
          fi

  # ─── 2. Container Build Verification ──────────────────────────────────────
  docker-build-verification:
    name: 🐳 Docker — Containerization Build Check
    needs: quality-and-tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker Image (Dry-Run Check)
        run: |
          docker build -t smart-agriculture-ai:${{ github.sha }} .

  # ─── 3. Continuous Deployment: Azure VM Rollout ───────────────────────────
  deploy-production:
    name: 🚀 CD — Automated Rollout to Azure VM
    needs: [ quality-and-tests, docker-build-verification ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: https://plantapi-abdo.uaenorth.cloudapp.azure.com
    steps:
      - name: 🔑 Check Azure Deployment Secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.AZURE_SSH_KEY }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "⚠️ Azure SSH key secret (AZURE_SSH_KEY) is not yet set in repository secrets."
          fi

      - name: 🚀 Deploy to Azure Production Server
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST || '20.46.50.255' }}
          username: ${{ secrets.AZURE_VM_USER || 'azureuser' }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          timeout: 120s
          script: |
            set -e
            echo "📡 Connected to Azure VM: $(hostname)"
            cd /home/azureuser/smart-agriculture-ai

            echo "📥 Fetching and applying latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Checking Python virtual environment dependencies..."
            ./venv/bin/pip install -q --no-cache-dir -r requirements.txt

            echo "🔄 Restarting smart-agri systemd service..."
            sudo systemctl restart smart-agri

            echo "🩺 Probing local health check probe with warmup retry loop..."
            HEALTHY=false
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:8000/health > /dev/null; then
                HEALTHY=true
                echo "✅ Service is online and healthy on attempt $i!"
                break
              fi
              echo "Waiting for model warmup... (attempt $i/15)"
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "❌ Health check timed out after 30 seconds!"
              sudo journalctl -u smart-agri -n 40 --no-pager
              exit 1
            fi

      - name: 🌐 External Production Health Probe
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          echo "Testing external HTTPS endpoint: https://plantapi-abdo.uaenorth.cloudapp.azure.com/health"
          curl -sf -k https://plantapi-abdo.uaenorth.cloudapp.azure.com/health || {
            echo "⚠️ External probe warning (DNS/SSL resolution check)";
          }

      - name: 📋 Post Deployment Step Summary
        run: |
          echo "## 🚀 Deployment Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-secrets.outputs.has_secrets }}" = "true" ]; then
            echo "✅ Successfully deployed commit \`${{ github.sha }}\` to Azure Production VM (\`20.46.50.255\`)." >> $GITHUB_STEP_SUMMARY
            echo "🔗 **Live URL**: [https://plantapi-abdo.uaenorth.cloudapp.azure.com](https://plantapi-abdo.uaenorth.cloudapp.azure.com)" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Continuous Deployment is configured and ready!**" >> $GITHUB_STEP_SUMMARY
            echo "To enable fully automated GitHub Actions rollout, add the following GitHub Secret under **Settings > Secrets and variables > Actions**:" >> $GITHUB_STEP_SUMMARY
            echo "- \`AZURE_SSH_KEY\`: Content of your private SSH key (\`ar_key.pem\`)" >> $GITHUB_STEP_SUMMARY
            echo "- \`AZURE_VM_HOST\` (Optional, defaults to \`20.46.50.255\`)" >> $GITHUB_STEP_SUMMARY
            echo "- \`AZURE_VM_USER\` (Optional, defaults to \`azureuser\`)" >> $GITHUB_STEP_SUMMARY
          fi
