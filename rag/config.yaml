embedding:
  model_name: "BAAI/bge-m3"
  dimension: 1024
  device: "cpu"

vector_store:
  provider: "chroma"
  persist_directory: "./chroma_db"
  collection_name: "egyptian_agriculture"

llm:
  provider: "mock"
  model_name: "fast-arabic-llm"
  temperature: 0.1
  max_tokens: 512

retrieval:
  top_k_vector: 20
  top_k_bm25: 20
  top_k_fused: 20
  rrf_k: 60
  default_weights:
    disease_query:
      vector: 0.5
      bm25: 0.5
    dosage_lookup:
      vector: 0.3
      bm25: 0.7
    general_advice:
      vector: 0.7
      bm25: 0.3

rerank:
  top_k: 5
  use_cross_encoder: false

confidence:
  threshold: 0.40

logging:
  requests_log: "logs/requests.jsonl"
  fallback_log: "logs/fallback_queries.jsonl"
