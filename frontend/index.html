<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الزراعي الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f3f4f6;
        }
        .chat-container {
            height: calc(100vh - 160px);
        }
        /* Loader */
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="flex flex-col h-screen bg-gray-100">

    <!-- Header -->
    <header class="bg-green-600 text-white p-4 shadow-md flex items-center justify-between z-10">
        <div class="flex items-center gap-3">
            <div class="bg-white p-2 rounded-full text-green-600">
                <i class="fas fa-leaf text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold">الخبير الزراعي</h1>
                <p class="text-xs text-green-200" id="weather-info">جاري التحقق من الطقس...</p>
            </div>
        </div>
        <button class="text-white hover:text-green-200"><i class="fas fa-ellipsis-v"></i></button>
    </header>

    <!-- Chat Area -->
    <main class="flex-1 overflow-y-auto p-4 chat-container" id="chat-box">
        <!-- Initial Message -->
        <div class="flex mb-4">
            <div class="bg-white text-gray-800 p-4 rounded-2xl rounded-tr-none shadow-sm max-w-[85%] border border-gray-100">
                <p class="font-semibold text-green-600 mb-1">الخبير الزراعي</p>
                <p>أهلاً بك يا غالي! أنا المساعد الزراعي الذكي المعتمد على وزارة الزراعة.</p>
                <p class="mt-2 text-sm text-gray-600">اسألني عن أي مرض، حشرة، مبيد، أو نصيحة لزراعة أرضك.</p>
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white p-3 shadow-lg border-t border-gray-200">
        <form id="chat-form" class="flex gap-2 max-w-4xl mx-auto">
            <input type="text" id="user-input" required
                class="flex-1 bg-gray-100 rounded-full px-5 py-3 focus:outline-none focus:ring-2 focus:ring-green-500 text-gray-800 placeholder-gray-500"
                placeholder="اكتب سؤالك هنا (مثال: علاج المن في القمح)..." autocomplete="off">
            <button type="submit" id="send-btn"
                class="bg-green-600 text-white rounded-full w-12 h-12 flex items-center justify-center hover:bg-green-700 transition-colors shadow-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
                <i class="fas fa-paper-plane text-sm transform -translate-x-0.5"></i>
            </button>
        </form>
    </footer>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const sendBtn = document.getElementById('send-btn');
        const weatherInfo = document.getElementById('weather-info');

        // Markdown formatter (very basic)
        function formatText(text) {
            let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }

        function appendUserMessage(message) {
            const div = document.createElement('div');
            div.className = 'flex justify-end mb-4';
            div.innerHTML = `
                <div class="bg-green-600 text-white p-4 rounded-2xl rounded-tl-none shadow-sm max-w-[85%]">
                    <p>${message}</p>
                </div>
            `;
            chatBox.appendChild(div);
            scrollToBottom();
        }

        function appendBotMessage(message, sources = []) {
            const div = document.createElement('div');
            div.className = 'flex mb-4';
            
            let sourcesHtml = '';
            if (sources.length > 0) {
                sourcesHtml = `<div class="mt-3 pt-2 border-t border-gray-100 text-xs text-gray-500">
                    <i class="fas fa-book-open ml-1"></i> المصادر: ${sources.join('، ')}
                </div>`;
            }

            div.innerHTML = `
                <div class="bg-white text-gray-800 p-4 rounded-2xl rounded-tr-none shadow-sm max-w-[85%] border border-gray-100">
                    <p class="font-semibold text-green-600 mb-1">الخبير الزراعي</p>
                    <div class="text-gray-700 leading-relaxed">${formatText(message)}</div>
                    ${sourcesHtml}
                </div>
            `;
            chatBox.appendChild(div);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const div = document.createElement('div');
            div.id = 'typing-indicator';
            div.className = 'flex mb-4';
            div.innerHTML = `
                <div class="bg-white text-gray-800 p-4 rounded-2xl rounded-tr-none shadow-sm border border-gray-100">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatBox.appendChild(div);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) indicator.remove();
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // UI updates
            appendUserMessage(message);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50');
            showTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: message })
                });

                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                removeTypingIndicator();
                appendBotMessage(data.answer, data.sources);
                
                if (data.weather) {
                    weatherInfo.textContent = data.weather;
                }
            } catch (error) {
                removeTypingIndicator();
                appendBotMessage('عذراً، حدث خطأ في الاتصال بالخادم. يرجى المحاولة مرة أخرى.');
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-50');
                userInput.focus();
            }
        });
    </script>
</body>
</html>
